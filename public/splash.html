<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #080D16;
    font-family: 'Segoe UI', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }

  /* Full-window SVG art layer */
  .art-layer {
    position: fixed; inset: 0; z-index: 0;
  }
  .art-layer svg {
    width: 100%; height: 100%;
  }

  /* Brand overlay - positioned bottom-left, large */
  .brand-overlay {
    position: fixed;
    bottom: 10vh; left: 8vw;
    z-index: 5;
    display: flex; flex-direction: column;
    align-items: flex-start;
    -webkit-app-region: no-drag;
  }

  .brand-wordmark {
    width: min(460px, 60vw); height: auto;
    margin-bottom: 14px;
    filter: drop-shadow(0 8px 28px rgba(0,0,0,0.5));
  }

  .brand-tag {
    font-size: 12px; font-weight: 500;
    color: rgba(180,195,215,0.50);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .brand-ver {
    display: inline-block;
    font-size: 11px; font-weight: 500;
    color: rgba(160,180,200,0.4);
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border: 1px solid rgba(160,180,200,0.12);
    border-radius: 3px;
  }

  /* Bottom-right status */
  .status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8vw 20px 8vw;
    -webkit-app-region: no-drag;
    background: linear-gradient(0deg, rgba(8,13,22,0.80) 0%, transparent 100%);
    padding-top: 28px;
  }

  .status-text {
    font-size: 11.5px; font-weight: 400;
    color: #5A6577;
    letter-spacing: 0.03em;
    max-width: 65%;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

  .status-build {
    font-size: 11px; font-weight: 400;
    color: rgba(140,155,175,0.28);
    letter-spacing: 0.05em;
    flex-shrink: 0;
    margin-left: 20px;
  }

  @media (max-width: 700px) {
    .brand-overlay { bottom: 8vh; left: 6vw; }
    .brand-wordmark { width: 320px; }
    .status-bar { padding: 0 6vw 12px 6vw; }
  }

  /* ── Progress bar: left-to-right sliding shimmer ── */
  .progress-track {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 12;
    height: 2px;
    background: rgba(8,13,22,0.60);
  }
  .progress-fill {
    height: 100%; width: 40%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(109,179,216,0.15) 20%,
      rgba(109,179,216,0.50) 50%,
      rgba(109,179,216,0.15) 80%,
      transparent 100%
    );
    animation: slideRight 1.6s ease-in-out infinite;
  }
  @keyframes slideRight {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
</style>
</head>
<body>

<!-- SVG Abstract Art -->
<div class="art-layer">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- background gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#080D16"/>
      <stop offset="35%"  stop-color="#0B1322"/>
      <stop offset="70%"  stop-color="#0E182A"/>
      <stop offset="100%" stop-color="#111D33"/>
    </linearGradient>

    <!-- terrain gradients -->
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1B3550"/>
      <stop offset="100%" stop-color="#0F2538"/>
    </linearGradient>
    <linearGradient id="t2" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#1E3D55"/>
      <stop offset="100%" stop-color="#142E40"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%"   stop-color="#234560"/>
      <stop offset="100%" stop-color="#163040"/>
    </linearGradient>
    <linearGradient id="t4" x1="1" y1="0" x2="0" y2="0.6">
      <stop offset="0%"   stop-color="#1E3D52"/>
      <stop offset="100%" stop-color="#142A38"/>
    </linearGradient>

    <!-- warm accent gradients -->
    <linearGradient id="warm1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#C2783A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B4518" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="warm2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#D4894A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7A3A10" stop-opacity="0.05"/>
    </linearGradient>

    <!-- teal accent -->
    <linearGradient id="teal1" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1D8F9E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D4A52" stop-opacity="0.05"/>
    </linearGradient>

    <!-- glow gradients for accent shapes -->
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#E8A860" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C2783A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#3DB8C8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1890A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#5E8EC0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2E5E90" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky background -->
  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- ===== TERRAIN LAYERS: flowing organic landforms ===== -->

  <!-- far background layer -->
  <path d="M0 380 Q180 320 360 370 Q540 420 720 350 Q900 280 1080 360 Q1260 440 1440 340 L1440 900 L0 900 Z"
        fill="url(#t1)" opacity="0.6"/>

  <!-- mid-far layer -->
  <path d="M0 440 Q200 390 400 420 Q600 450 800 400 Q1000 350 1200 430 Q1320 470 1440 420 L1440 900 L0 900 Z"
        fill="url(#t2)" opacity="0.7"/>

  <!-- mid layer with dramatic curve -->
  <path d="M0 500 Q160 460 340 500 Q520 540 700 470 Q880 400 1060 480 Q1240 560 1440 490 L1440 900 L0 900 Z"
        fill="url(#t3)" opacity="0.75"/>

  <!-- foreground sweeping ridge -->
  <path d="M0 570 Q200 540 420 580 Q640 620 860 540 Q1060 460 1260 550 Q1360 590 1440 560 L1440 900 L0 900 Z"
        fill="url(#t4)" opacity="0.8"/>

  <!-- ===== WARM ACCENT SWEEPS ===== -->

  <!-- warm amber band sweeping across mid -->
  <path d="M0 460 Q300 420 600 470 Q900 520 1200 450 Q1350 420 1440 440 L1440 520 Q1350 500 1200 530 Q900 600 600 550 Q300 500 0 540 Z"
        fill="url(#warm1)" opacity="0.55"/>

  <!-- secondary warm accent -->
  <path d="M0 580 Q250 560 500 590 Q750 620 1000 570 Q1250 520 1440 560 L1440 610 Q1250 580 1000 630 Q750 680 500 650 Q250 620 0 640 Z"
        fill="url(#warm2)" opacity="0.4"/>

  <!-- teal ribbon -->
  <path d="M0 400 Q280 370 560 410 Q840 450 1120 390 Q1300 350 1440 380 L1440 430 Q1300 400 1120 440 Q840 500 560 460 Q280 420 0 450 Z"
        fill="url(#teal1)" opacity="0.45"/>

  <!-- ===== GEOMETRIC ACCENT ELEMENTS ===== -->

  <!-- thin horizontal accent lines -->
  <line x1="0" y1="348" x2="520" y2="348" stroke="rgba(180,200,220,0.06)" stroke-width="1"/>
  <line x1="900" y1="395" x2="1440" y2="395" stroke="rgba(180,200,220,0.05)" stroke-width="1"/>
  <line x1="0" y1="638" x2="680" y2="638" stroke="rgba(200,180,150,0.07)" stroke-width="1"/>

  <!-- vertical structural line -->
  <line x1="340" y1="200" x2="340" y2="720" stroke="rgba(180,200,220,0.04)" stroke-width="1"/>

  <!-- small geometric diamond -->
  <path d="M1120 310 L1140 330 L1120 350 L1100 330 Z"
        fill="none" stroke="rgba(200,180,150,0.15)" stroke-width="1.5"/>
  <path d="M1180 380 L1195 395 L1180 410 L1165 395 Z"
        fill="none" stroke="rgba(60,160,180,0.12)" stroke-width="1"/>

  <!-- ===== ATMOSPHERIC GLOW SPOTS ===== -->
  <circle cx="280" cy="420" r="120" fill="url(#glow1)" opacity="0.35"/>
  <circle cx="1050" cy="380" r="150" fill="url(#glow2)" opacity="0.3"/>
  <circle cx="720" cy="500" r="100" fill="url(#glow3)" opacity="0.2"/>
  <circle cx="1300" cy="520" r="80"  fill="url(#glow1)" opacity="0.18"/>

  <!-- ===== SCATTERED POINTS (like distant lights) ===== -->
  <circle cx="180" cy="310" r="1.2" fill="rgba(220,210,180,0.4)"/>
  <circle cx="420" cy="280" r="1.0" fill="rgba(200,190,160,0.35)"/>
  <circle cx="650" cy="320" r="1.3" fill="rgba(220,210,180,0.4)"/>
  <circle cx="880" cy="290" r="0.9" fill="rgba(200,190,160,0.3)"/>
  <circle cx="1080" cy="310" r="1.1" fill="rgba(220,210,180,0.35)"/>
  <circle cx="260" cy="550" r="1.0" fill="rgba(180,200,210,0.35)"/>
  <circle cx="540" cy="580" r="1.2" fill="rgba(180,200,210,0.4)"/>
  <circle cx="780" cy="530" r="0.8" fill="rgba(180,200,210,0.3)"/>
  <circle cx="1000" cy="590" r="1.1" fill="rgba(180,200,210,0.35)"/>
  <circle cx="1380" cy="480" r="1.0" fill="rgba(200,180,150,0.35)"/>
  <circle cx="70"  cy="500" r="0.9" fill="rgba(200,180,150,0.3)"/>
  <circle cx="1220" cy="340" r="1.2" fill="rgba(180,200,210,0.4)"/>
</svg>
</div>

<!-- Brand overlay -->
<div class="brand-overlay">
  <svg class="brand-wordmark" viewBox="0 0 540 100" xmlns="http://www.w3.org/2000/svg"><text x="0" y="76" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="700" font-size="80" fill="#E8EDF5" letter-spacing="1">Radar</text><text x="248" y="76" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="700" font-size="80" fill="#6DB3D8" letter-spacing="1">View</text></svg>
  <div class="brand-tag">Offline Radar Track Visualization</div>
  <div class="brand-ver">v0.4.0 &middot; Build 2026.06</div>
</div>

<!-- Progress bar -->
<div class="progress-track"><div class="progress-fill"></div></div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-text" id="log-text">正在启动 &middot; 初始化引擎...</div>
  <div class="status-build">RadarView 0.4</div>
</div>

<script>
var gRealMsg = false;

function addLog(msg) {
  gRealMsg = true;
  document.getElementById('log-text').textContent = msg;
}

(function() {
  var actions = [
    "正在加载","正在初始化","正在校验","正在解析","正在连接",
    "正在配置","正在编译","正在同步","正在读取","正在构建",
    "正在预热","正在挂载","正在注册","正在绑定","正在分配",
  ];
  var targets = [
    "渲染引擎","地图视口","瓦片服务","IPC 通道","数据库连接池",
    "全局配置","航迹解析器","ADS-B 解码器","雷达数据模块","坐标系统",
    "投影引擎","图层管理器","字体资源","图标缓存","着色器程序",
    "纹理缓存","几何缓冲区","内存池","线程池","事件总线",
    "命令注册表","快捷键绑定","主题引擎","面板布局","状态管理器",
    "网络适配器","本地存储","日志系统","性能监控","安全沙箱",
    "Cesium 内核","Entity 管理器","Primitive 收集器","帧调度器",
    "MBTiles 索引","离线缓存","SQLite WAL","数据迁移器",
    "时间滤波器","轨迹插值器","旗标渲染器","行政区划数据",
    "回放控制器","设置持久化","批次管理器","导入流水线",
  ];
  var details = [
    "", "", "", "", "", "", "", "", "", "",
    " \xb7 阶段 1/3", " \xb7 阶段 2/3", " \xb7 阶段 3/3",
    " \xb7 读取索引...", " \xb7 建立连接...", " \xb7 分配缓冲...",
    " \xb7 config.json", " \xb7 settings.db", " \xb7 user_prefs.dat",
    " \xb7 tile_cache/", " \xb7 shaders/", " \xb7 fonts/",
    " \xb7 端口 :dynamic", " \xb7 线程 #:tid",
  ];
  var pool = [];
  for (var i = 0; i < 500; i++) {
    var a = actions[Math.floor(Math.random() * actions.length)];
    var t = targets[Math.floor(Math.random() * targets.length)];
    var d = details[Math.floor(Math.random() * details.length)];
    var msg = "正在启动 \xb7 " + a + " " + t;
    if (d) {
      d = d.replace(":dynamic", (30000 + Math.floor(Math.random() * 40000)).toString());
      d = d.replace(":tid", Math.floor(Math.random() * 16).toString());
      msg += d;
    }
    pool.push(msg);
  }
  var seen = {};
  window._msgPool = pool.filter(function(m) { if (seen[m]) return false; seen[m] = true; return true; });
})();

var gFakeIdx = 0;
function animateLog() {
  if (gRealMsg || !window._msgPool) return;
  gFakeIdx = (gFakeIdx + 1) % window._msgPool.length;
  document.getElementById("log-text").textContent = window._msgPool[gFakeIdx];
}
setInterval(animateLog, 220);
animateLog();
</script>
</body>
</html>
